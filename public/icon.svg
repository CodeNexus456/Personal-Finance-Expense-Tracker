<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#finGrad)" />
  <!-- Wallet Body -->
  <rect x="96" y="160" width="320" height="220" rx="36" fill="#ffffff" />
  <!-- Wallet Flap -->
  <path d="M96 220 C96 185 125 156 160 156 L352 156 C387 156 416 185 416 220 L416 230 L96 230 Z" fill="#e2e8f0" />
  <!-- Card peeking out -->
  <rect x="140" y="120" width="232" height="70" rx="16" fill="url(#cardGrad)" />
  <!-- Coin / Clasp -->
  <circle cx="340" cy="270" r="32" fill="#f59e0b" stroke="#ffffff" stroke-width="6" />
  <!-- Rupee / Currency glyph in coin -->
  <path d="M330 256 L350 256 M330 264 L350 264 M330 256 C336 256 342 260 342 268 C342 276 336 280 330 280 L346 294" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
